[package]
name = "et-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "EternalTerminal client library: resilient encrypted terminal sessions with reconnect and catch-up, wire-compatible with upstream C++. Embeddable; the SSH handshake is exposed as pure functions."

[dependencies]
et-proto.workspace = true
buffa.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
# rt-multi-thread: the PF-flood backpressure test needs worker parallelism.
tokio = { workspace = true, features = ["rt-multi-thread"] }
