[package]
name = "et-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "EternalTerminal client: resilient encrypted terminal sessions with reconnect and catch-up, wire-compatible with upstream C++."

[dependencies]
et-proto.workspace = true
prost.workspace = true
thiserror.workspace = true
getrandom.workspace = true
tokio.workspace = true

# CLI-only convenience (raw mode, resize events); kept out of the library API.
crossterm.workspace = true

[dev-dependencies]
et-server = { workspace = true, features = ["testing"] }
