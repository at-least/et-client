[package]
name = "et-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Wire layer of the EternalTerminal protocol: packets, framing, crypto, protobuf messages."

[dependencies]
buffa.workspace = true
crypto_secretbox.workspace = true
thiserror.workspace = true
getrandom.workspace = true
zeroize.workspace = true
# rt: the library itself spawns tasks (backed actor, engine, conn tasks);
# listing it keeps the manifest an honest statement of what this crate
# needs, instead of relying on additive workspace features to supply it.
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "time"] }

[dev-dependencies]
# rt-multi-thread: the concurrent-drop test needs true worker parallelism.
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
