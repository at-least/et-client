[workspace]
resolver = "2"
members = [
    "crates/et-proto",
    "crates/et-client",
    "tools/et-proto-gen",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/at-least/et-client"

# Wire-format dependencies are pinned exact across the workspace (conch-core
# practice: a byte-for-byte-pinned wire format must not drift with a dep bump).
# Infra dependencies (tokio) are semver ranges; the committed
# Cargo.lock makes the build reproducible regardless.
[workspace.dependencies]
et-proto = { path = "crates/et-proto", version = "0.1.0" }
et-client = { path = "crates/et-client", version = "0.1.0" }
buffa = "=0.9.2"
buffa-build = "=0.9.2"
crypto_secretbox = "=0.1.1"
thiserror = "2"
getrandom = "0.4"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "process", "macros"] }

[profile.release]
lto = "thin"

# The backed-connection tests push >64 MiB through the secretbox stream; the
# unoptimized crypto crates make that take minutes in a plain dev build.
# Only the crypto family is optimized; everything else keeps dev settings.
[profile.dev.package.crypto_secretbox]
opt-level = 2
[profile.dev.package.salsa20]
opt-level = 2
[profile.dev.package.poly1305]
opt-level = 2
